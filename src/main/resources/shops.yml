# Each category becomes a button in the main menu.
# Items are added automatically across as many pages as needed.
#
# Category options:
#   title:          inventory title when the category is open
#   icon:           item shown in the main menu
#   slot:           main menu slot (optional, 0-based)
#   color:          colour code for the tooltips, e.g. "&a"
#   display-name:   name used in the tooltip text (default = category id)
#   button-name:    big name on the button (default = display-name)
#   description:    grey line under the name (optional)
#   currency:       vault (default) or shards - see config.yml
#   page-rows:      item rows per page, 1-4 (default 4 = 36 items per page)
#
# Item options:
#   buy:  price to buy 1 item  (use -1 to disable buying)

